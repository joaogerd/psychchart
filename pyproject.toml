[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychchart"
version = "1.0.1"
description = "Psychrometric chart generator with YAML-driven configuration"
readme = "README.md"
license = { text = "LGPL-3.0" }
authors = [
  { name = "Dr. Joao Gerd Zell de Mattos" }
]
requires-python = ">=3.10"

dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pydantic>=2",
  "pyyaml",
  "scipy",
]

[project.optional-dependencies]
app = ["streamlit"]
api = [
  "fastapi",
  "httpx",
  "uvicorn",
]
dev = [
  "fastapi",
  "httpx",
  "pytest",
  "pytest-cov",
  "ruff",
  "black",
]
parquet = ["pyarrow"]

[project.scripts]
psychchart = "psychchart.cli:main"
psychchart-app = "psychchart.app.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psychchart = [
  "profiles/*.yaml",
  "profiles/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
