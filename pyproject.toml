[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychchart"
version = "0.2.0"
description = "Psychrometric chart generator with YAML-driven configuration"
readme = "README.md"
license = { text = "LGPL-3.0" }
authors = [
  { name = "Dr. Joao Gerd Zell de Mattos" }
]
requires-python = ">=3.10"

dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pydantic>=2",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
parquet = [
  "pyarrow",
]

[project.scripts]
psychchart = "psychchart.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

