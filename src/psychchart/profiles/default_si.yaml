chart:
  t_min: 0
  t_max: 50
  y_min: 0.0
  y_max: 0.03
  pressure: 101325

  xlabel: "Dry-bulb temperature (°C)"
  ylabel: "Humidity ratio (kg/kg)"

  title: null
  output: "chart.png"
  dpi: 150
  style: null
  grid: true
  figsize: [16, 8]

  show_tw_grid: true
  tw_grid:
    vertical: true
    horizontal: true
    every:
      T: 5.0
      W: 0.002

  tw_grid_style:
    color: "#999999"
    linewidth: 0.5
    linestyle: "-"
    alpha: 0.3

isolines:
  relative_humidity:
    enabled: true
    values: [0.1, 0.3, 0.5, 0.7, 0.9]
    color: "#8B1E3F"
    linestyle: "-"
    linewidth: 0.7
    alpha: 0.45
    labels: false
    label_fontsize: 8
    label_fmt: null

  wet_bulb:
    enabled: false
    values: [10, 15, 20, 25, 30, 35]
    color: "#B8860B"
    linestyle: "--"
    linewidth: 0.9
    alpha: 0.75
    labels: false
    label_fontsize: 8
    label_fmt: null

  moisture_quantity:
    enabled: false
    values: [0.005, 0.010, 0.015, 0.020]
    color: "#2E6B57"
    linestyle: ":"
    linewidth: 0.95
    alpha: 0.80
    labels: false
    label_fontsize: 8
    label_fmt: null

  enthalpy:
    enabled: false
    values: [20, 40, 60, 80, 100]
    color: "#355C7D"
    linestyle: "-."
    linewidth: 0.9
    alpha: 0.70
    labels: false
    label_fontsize: 8
    label_fmt: null

  specific_volume:
    enabled: false
    values: [0.78, 0.82, 0.86, 0.90, 0.94]
    color: "#6C757D"
    linestyle: "--"
    linewidth: 0.8
    alpha: 0.65
    labels: false
    label_fontsize: 8
    label_fmt: null

zones: []
points: []
indexes: []
index_zones: []
observations: []
temporal_overlays: []
