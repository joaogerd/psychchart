# =============================================================================
# Psychrometric chart – ITU full visualization
# =============================================================================

chart:
  t_min: 0
  t_max: 50
  pressure: 101325

  y_min: 0.0
  y_max: 0.035

  title: "Trajetória Térmica e Fadiga Acumulada"
    
  output: psychchart_itu.png
  dpi: 200


# -----------------------------------------------------------------------------
# Psychrometric isolines
# -----------------------------------------------------------------------------
isolines:
  relative_humidity:
    enabled: true
    values: [0.1, 0.3, 0.5, 0.7, 0.9]
    color: "#8B1E3F"
    linestyle: "-"
    linewidth: 0.7
    alpha: 0.45

  wet_bulb:
    enabled: false
    values: [10, 15, 20, 25, 30, 35]
    color: "#B8860B"
    linestyle: "--"
    linewidth: 0.9
    alpha: 0.75

  moisture_quantity:
    enabled: false
    values: [0.005, 0.010, 0.015, 0.020]
    color: "#2E6B57"
    linestyle: ":"
    linewidth: 0.95
    alpha: 0.80

  enthalpy:
    enabled: false
    values: [20, 40, 60, 80, 100]
    color: "#355C7D"
    linestyle: "-."
    linewidth: 0.9
    alpha: 0.70

  specific_volume:
    enabled: false
    values: [0.78, 0.82, 0.86, 0.90, 0.94]
    color: "#6C757D"
    linestyle: "--"
    linewidth: 0.8
    alpha: 0.65
# -----------------------------------------------------------------------------
# Continuous ITU field (background)
# -----------------------------------------------------------------------------
indexes:
  - index: ITU
    label: ITU

      #    levels: &itu_levels [20, 72, 78, 84, 90, 200]
    cmap: Pastel2
    vmin: 20
    vmax: 95

    render:
      #field:
      #  alpha: 0.65
      #  colorbar: true

      isolines:
        #levels: *itu_levels
        style: ":"
        color: black
        linewidth: 1.5
        label: true

  - index: TE
    label: Thermal Excess

      #levels: [0, 1.5, 5.5, 11.0, 25]
      #cmap: Pastel2
    vmin: 0
    vmax: 30

    render:
      field:
        alpha: 1.0
        colorbar: true

# ------------------------------------------------------------------
# Temporal overlays
# ------------------------------------------------------------------

temporal_overlays:
  - type: CTA_TRAJECTORY
    data: examples/animal_day.csv
    t_col: temp
    rh_col: rh
    time_col: hour
    cta_col: cta_acumulada

    show_path: true
    path_color: blue
    path_alpha: 0.6
    path_linewidth: 1.2

    point_size: 46
    point_edgecolor: black
    point_edgewidth: 0.8
# -----------------------------------------------------------------------------
# Comfort zones (example – management-oriented)
# -----------------------------------------------------------------------------
zones:
  - name: Taurinos
    t_range: [15, 25]
    rh_range: [0.40, 0.70]
    follow_rh: true
    edgecolor: darkred
    facecolor: none
    linewidth: 2.0

  - name: Girolando
    t_range: [15, 28]
    rh_range: [0.40, 0.75]
    follow_rh: true
    edgecolor: magenta
    facecolor: none
    linewidth: 2.0


# -----------------------------------------------------------------------------
# Reference points
# -----------------------------------------------------------------------------
points:

  - label: $P_{a}$
    t: 32        # °C
    rh: 0.55     # 55 %
    marker: "o"
    color: black

  - label: $P_{b}$
    t: 46
    rh: 0.45
    marker: "s"
    color: navy

