chart:
  t_min: 0
  t_max: 40
  pressure: 101325
  xlabel: "Dry-bulb temperature (°C)"
  ylabel: "Humidity ratio (kg/kg)"
  output: "givoni_basic.png"
  dpi: 150
  style: "seaborn-v0_8"

isolines:
  relative_humidity:
    enabled: true
    values: [30, 50, 70, 90]
    linestyle: "--"
    color: gray
    labels: true

zones:
  - name: "Givoni comfort zone"
    t_range: [20, 26]
    rh_range: [40, 60]
    follow_rh: true
    facecolor: lightgreen
    edgecolor: green
    linewidth: 1.5
    alpha: 0.25

points:
  - label: "Case A"
    t: 25
    rh: 50
    marker: "o"
    color: red
