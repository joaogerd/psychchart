chart:
  t_min: 0
  t_max: 50
  pressure: 101325
  y_min: 0.0
  y_max: 0.035
  xlabel: "Dry-bulb temperature (°C)"
  ylabel: "Humidity ratio (kg/kg)"
  title: "Psychrometric chart with cattle comfort zones"
  output: "bovinos_racas.png"
  dpi: 200
  style: "seaborn-v0_8"

isolines:
  relative_humidity:
    enabled: true
    values: [0.2, 0.4, 0.6, 0.8]
    color: crimson
    linestyle: "-"
    linewidth: 1.0

  wet_bulb:
    enabled: true
    values: [10, 15, 20, 25, 30, 35]
    color: goldenrod
    linestyle: "--"
    linewidth: 0.9

  moisture_quantity:
    enabled: true
    values: [0.005, 0.010, 0.015, 0.020]
    color: forestgreen
    linestyle: "-."
    linewidth: 0.9

zones:
  - name: "Taurinos"
    t_range: [15, 25]
    rh_range: [0.40, 0.70]
    follow_rh: true
    edgecolor: darkred
    facecolor: none
    linewidth: 2.0
    alpha: 1.0

  - name: "Girolando"
    t_range: [15, 28]
    rh_range: [0.40, 0.75]
    follow_rh: true
    edgecolor: magenta
    facecolor: none
    linewidth: 2.0
    alpha: 1.0

points:
  - label: "Sample_A"
    t: 32
    rh: 0.55
    marker: "o"
    color: black

indexes:
  - index: "ITU"
    label: "ITU"
    cmap: "inferno"
    vmin: 60
    vmax: 90
    render:
      field:
        alpha: 0.35
        colorbar: true
      isolines:
        levels: [68, 72, 76, 80]
        color: black
        style: "-"
        linewidth: 1.1
        label: true
data_layers:
  - data: "data/animal_day.csv"
    format: "csv"

    projection:
      t_col: temp
      rh_col: rh
      rh_unit: auto

    temporal:
      time_col: hour
      sort: true

    fields:
      - type: direct_column
        name: CTA
        col: cta_acumulada

    render:
      - type: path
        order_by: hour
        color_by: CTA
        cmap: viridis
        vmin: 0.0
        vmax: 30.0
        alpha: 0.85
        linewidth: 2.0
        linestyle: "-"
        label: "Trajetória temporal"
        zorder: 20

      - type: scatter
        value: CTA
        cmap: viridis
        size: 52
        alpha: 1.0
        edgecolor: black
        edgewidth: 0.8
        colorbar: false
        zorder: 25

      - type: annotate
        every: 3
        template: "{time:.1f}h\n(CTA:{value:.0f})"
        time_field: hour
        value_field: CTA
        dx: 0.35
        dy: 0.0005
        fontsize: 8.0
        fontweight: bold
        color: black
        zorder: 30
