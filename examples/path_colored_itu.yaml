chart:
  t_min: 10
  t_max: 45
  y_min: 0.0
  y_max: 0.035
  pressure: 101325
  title: "Path colored by ITU"
  output: "path_colored_itu.png"
  dpi: 180

data_layers:
  - data: "examples/data/animal_day_with_itu.csv"
    format: "csv"
    projection:
      t_col: temp
      rh_col: rh
      rh_unit: auto
    temporal:
      time_col: hour
      sort: true
    render:
      - type: path
        order_by: hour
        color_by: itu
        cmap: viridis
        vmin: 68.0
        vmax: 90.0
        alpha: 0.95
        linewidth: 3.0
        linestyle: "-"
        label: "ITU trajectory"
        zorder: 40
