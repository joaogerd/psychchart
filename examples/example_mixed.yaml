chart:
  t_min: 10
  t_max: 40
  y_min: 0.0
  y_max: 0.030
  pressure: 101325
  xlabel: "Dry-bulb temperature (°C)"
  ylabel: "Humidity ratio (kg/kg)"
  dpi: 150
  title: "Data layer - mixed renderers"
  output: "out_mixed.png"

data_layers:
  - data: "data/observations.csv"
    format: csv
    projection:
      t_col: T
      rh_col: RH
      rh_unit: fraction
    fields:
      - type: direct_column
        name: comfort_score
        col: comfort_score
    render:
      - type: density
        bins: [30, 30]
        cmap: Greys
        alpha: 0.25
        colorbar: false
        normalize: true
        zorder: 10

      - type: scalar_field
        value: comfort_score
        bins: [20, 20]
        cmap: plasma
        alpha: 0.55
        colorbar: true
        zorder: 20

      - type: scatter
        value: comfort_score
        cmap: viridis
        size: 42
        alpha: 0.95
        edgecolor: black
        edgewidth: 0.3
        colorbar: false
        zorder: 30
