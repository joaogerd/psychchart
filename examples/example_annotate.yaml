chart:
  t_min: 10
  t_max: 40
  y_min: 0.0
  y_max: 0.030
  pressure: 101325
  xlabel: "Dry-bulb temperature (°C)"
  ylabel: "Humidity ratio (kg/kg)"
  dpi: 150
  title: "Data layer - annotate"
  output: "out_annotate.png"

data_layers:
  - data: "examples/data/animal_day.csv"
    format: csv
    projection:
      t_col: temp
      rh_col: rh
      rh_unit: fraction
    temporal:
      time_col: hour
      sort: true
    fields:
      - type: direct_column
        name: CTA
        col: cta_acumulada
    render:
      - type: scatter
        value: CTA
        cmap: viridis
        size: 55
        alpha: 0.95
        edgecolor: black
        edgewidth: 0.4
        colorbar: true
        zorder: 25

      - type: annotate
        every: 1
        template: "{time}h | CTA={value:.0f}"
        time_field: hour
        value_field: CTA
        dx: 0.20
        dy: 0.0003
        fontsize: 8
        fontweight: bold
        color: black
        zorder: 30
