chart:
  t_min: 10
  t_max: 40
  y_min: 0.0
  y_max: 0.030
  pressure: 101325
  xlabel: "Dry-bulb temperature (°C)"
  ylabel: "Humidity ratio (kg/kg)"
  dpi: 150
  title: "Data layer - points"
  output: "out_points.png"

data_layers:
  - data: "data/observations.csv"
    format: csv
    projection:
      t_col: T
      rh_col: RH
      rh_unit: fraction
    render:
      - type: points
        color: black
        size: 32
        alpha: 0.9
        zorder: 40
