chart:
  t_min: 10
  t_max: 40
  y_min: 0.0
  y_max: 0.030
  pressure: 101325
  xlabel: "Dry-bulb temperature (°C)"
  ylabel: "Humidity ratio (kg/kg)"
  dpi: 150
  title: "Data layer - scatter"
  output: "out_scatter.png"

data_layers:
  - data: "examples/data/observations.csv"
    format: csv
    projection:
      t_col: T
      rh_col: RH
      rh_unit: fraction
    fields:
      - type: direct_column
        name: comfort_score
        col: comfort_score
    render:
      - type: scatter
        value: comfort_score
        cmap: viridis
        size: 48
        alpha: 0.9
        edgecolor: black
        edgewidth: 0.4
        colorbar: true
        zorder: 45
