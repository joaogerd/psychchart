chart:
  t_min: 10
  t_max: 45
  y_min: 0.0
  y_max: 0.035
  pressure: 101325
  title: "Trajetória Térmica e Fadiga Acumulada"
  output: "temporal_overlay.png"
  dpi: 180
  figsize: [12.5, 7.2]

  legend:
    show: true
    loc: "upper left"
    title: "Estado térmico acumulado"
    frameon: true
    fancybox: true
    framealpha: 0.95
    borderpad: 0.8
    labelspacing: 0.6
    handlelength: 2.2
    handletextpad: 0.8
    borderaxespad: 0.8
    fontsize: 9
    title_fontsize: 10

    entries:
      - type: classes_from_profile
        profile: CTA

indexes:
  - index: ITU
    label: ITU
    render:
      isolines:
        levels: [72, 78, 84, 90]
        color: black
        linewidth: 1.2
        style: ":"
        label: true

  - index: TE
    label: Thermal Excess
    render:
      field:
        alpha: 1.0
        colorbar: true

data_layers:
  - data: "data/animal_day.csv"
    format: "csv"

    projection:
      t_col: temp
      rh_col: rh
      rh_unit: auto

    temporal:
      time_col: hour
      sort: true

    fields:
      - type: direct_column
        name: CTA
        col: cta_acumulada

    render:
      - type: path
        order_by: hour
        color: "#2a9d8f"
        alpha: 0.90
        linewidth: 2.0
        linestyle: "-"
        label: "Trajetória temporal"
        zorder: 20

      - type: classified_points
        value_col: CTA
        profile: CTA
        order_by: hour
        size: 52
        alpha: 1.0
        edgecolor: black
        edgewidth: 0.8
        marker: "o"
        label: "Observações horárias"
        zorder: 25

      - type: annotate
        every: 1
        template: "{time:.1f}h"
        time_field: hour
        value_field: CTA
        dx: 0.035
        dy: 0.0005
        fontsize: 8.0
        fontweight: bold
        color: black
        zorder: 30

operational_profiles:
  dairy_cooling_default:
    name: dairy_cooling_default

    itu_classes:
      - {name: I0, min: null, max: 72.0}
      - {name: I1, min: 72.0, max: 78.0}
      - {name: I2, min: 78.0, max: 84.0}
      - {name: I3, min: 84.0, max: 90.0}
      - {name: I4, min: 90.0, max: null}

    humidity_classes:
      - {name: H0, min: 0.00, max: 0.60}
      - {name: H1, min: 0.60, max: 0.75}
      - {name: H2, min: 0.75, max: 1.01}

    load_classes:
      - {name: A0, min: 0.000, max: 0.005, floor_action: O0, representative: 0.0025}
      - {name: A1, min: 0.005, max: 0.010, floor_action: O1, representative: 0.0075}
      - {name: A2, min: 0.010, max: 0.015, floor_action: O2, representative: 0.0125}
      - {name: A3, min: 0.015, max: 0.025, floor_action: O3, representative: 0.0200}
      - {name: A4, min: 0.025, max: null, floor_action: O5, representative: 0.0300}

    base_matrix:
      I0: {H0: O0, H1: O0, H2: O0}
      I1: {H0: O1, H1: O2, H2: O3}
      I2: {H0: O2, H1: O3, H2: O4}
      I3: {H0: O3, H1: O4, H2: O4}
      I4: {H0: O5, H1: O5, H2: O5}

    action_styles:
      O0: {label: "Monitoramento", facecolor: "#d9f0d3"}
      O1: {label: "Ventilação básica", facecolor: "#78c679"}
      O2: {label: "Ventilação reforçada", facecolor: "#ffd92f"}
      O3: {label: "Ventilação + aspersão", facecolor: "#fdae61"}
      O4: {label: "Resfriamento máximo", facecolor: "#f46d43"}
      O5: {label: "Emergência", facecolor: "#d73027"}

    modifiers:
      high_temp_humidity:
        temp_ge: 30.0
        rh_ge: 0.75
        add_levels: 1

      high_temp_itu:
        temp_ge: 30.0
        itu_ge: 84.0
        add_levels: 1

      rising_load:
        dca_dt_gt: 0.001
        add_levels: 1

      recovery:
        dca_dt_lt: -0.001
        ca_lt: 0.010
        itu_lt: 78.0
        add_levels: -1

operational_overlays:
  - profile: dairy_cooling_default
    load_class: A2
    trend: steady
    alpha: 0.18
    zorder: 0.55
    show_boundaries: true
