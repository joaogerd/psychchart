chart:
  t_min: 10
  t_max: 45
  y_min: 0.0
  y_max: 0.035
  pressure: 101325
  title: "Trajetória Térmica e Fadiga Acumulada"
  output: "temporal_overlay.png"
  dpi: 180
  figsize: [12.5, 7.2]

  legend:
    show: true
    loc: "upper left"
    title: "Estado térmico acumulado"
    frameon: true
    fancybox: true
    framealpha: 0.95
    borderpad: 0.8
    labelspacing: 0.6
    handlelength: 2.2
    handletextpad: 0.8
    borderaxespad: 0.8
    fontsize: 9
    title_fontsize: 10

    entries:
      - type: classes_from_profile
        profile: CTA

indexes:
  - index: ITU
    label: ITU
    render:
      isolines:
        levels: [72, 78, 84, 90]
        color: black
        linewidth: 1.2
        style: ":"
        label: true

  - index: TE
    label: Thermal Excess
    render:
      field:
        alpha: 1.0
        colorbar: true

data_layers:
  - data: "examples/data/animal_day.csv"
    format: "csv"

    projection:
      t_col: temp
      rh_col: rh
      rh_unit: auto

    temporal:
      time_col: hour
      sort: true

    fields:
      - type: direct_column
        name: CTA
        col: cta_acumulada

    render:
      - type: path
        order_by: hour
        color: "#2a9d8f"
        alpha: 0.90
        linewidth: 2.0
        linestyle: "-"
        label: "Trajetória temporal"
        zorder: 20

      - type: classified_points
        value_col: CTA
        profile: CTA
        order_by: hour
        size: 52
        alpha: 1.0
        edgecolor: black
        edgewidth: 0.8
        marker: "o"
        label: "Observações horárias"
        zorder: 25

      - type: annotate
        every: 1
        template: "{time:.1f}h"
        time_field: hour
        value_field: CTA
        dx: 0.035
        dy: 0.0005
        fontsize: 8.0
        fontweight: bold
        color: black
        zorder: 30

# Uses the built-in dairy_cooling_default operational profile.
# Define operational_profiles explicitly only when a custom management policy is needed.
operational_overlays:
  - load_class: A2
    trend: steady
    alpha: 0.18
    zorder: 0.55
    show_boundaries: true
